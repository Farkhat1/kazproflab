# Example static-host configuration. Set the actual deployment directory.
# Configure TLS and HTTP -> HTTPS / www -> apex redirects in your hosting panel.
server {
    listen 80;
    server_name kazproflab.kz;
    root /var/www/kazproflab;
    index index.html;
    charset utf-8;
    autoindex off;

    add_header X-Content-Type-Options nosniff always;
    error_page 404 /404.html;

    location = /404.html {
        internal;
        add_header X-Robots-Tag "noindex, follow" always;
    }

    # Source extensionless addresses have no trailing slash.
    location ~ ^/(.+)/$ {
        return 301 /$1$is_args$args;
    }

    # No SPA fallback: unknown routes must return a real 404.
    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:js|css|woff2?)$ {
        try_files $uri =404;
        expires 30d;
    }

    location ~* \.(?:png|jpg|jpeg|webp|avif|svg|ico)$ {
        try_files $uri =404;
        expires 7d;
    }

    location ~ /\. {
        deny all;
    }
}
